[package]
name = "freya-virtual-list"
version = "0.1.0"
edition = "2021"

[lib]
name = "freya_virtual_list"

[dependencies]
# Pin to crates.io releases (semver-resolved) instead of a git rev so the
# project tracks stable releases and builds reproducibly for downstream users.
freya = { version = "0.4", features = ["sdk"] }

[dev-dependencies]
freya-testing = "0.4"
